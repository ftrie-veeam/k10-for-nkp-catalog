name: Publish NKP catalog

on:
  push:
    branches: [main]
    paths: ["applications/**", "release/**", ".github/workflows/publish.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NKP_VERSION: "2.19.0"
  WORKSPACE: dev-ws

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nkp CLI
        run: |
          set -euo pipefail
          curl -fsSL "https://downloads.d2iq.com/dkp/v${NKP_VERSION}/nkp_v${NKP_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp nkp
          sudo install -m 0755 /tmp/nkp /usr/local/bin/nkp
          nkp version

      - name: Validate
        run: nkp validate catalog-repository --repo-dir .

      - name: Build bundle
        run: |
          nkp experimental catalog release --release-spec release/release.yaml --repo-dir .
          ls -la ./*.tar

      - name: Push bundle to GHCR
        run: |
          set -euo pipefail
          registry="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          for tar in ./*.tar; do
            nkp push bundle --bundle "${tar}" \
              --to-registry "${registry}" \
              --to-registry-username "${{ github.actor }}" \
              --to-registry-password "${{ secrets.GITHUB_TOKEN }}"
          done

      - name: Print YAML for NKP UI
        continue-on-error: true
        run: |
          set -uo pipefail
          registry="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          url="oci://${registry}/k10-for-nkp-catalog/collection"
          {
            echo "## Catalog-Collection"
            echo '```'
            echo "nkp create catalog-collection --url ${url} --tag 2.19 --workspace ${WORKSPACE}"
            echo '```'
            echo "### YAML (dry-run) zum Einfügen in der NKP-UI"
            echo '```yaml'
            nkp create catalog-collection --url "${url}" --tag 2.19 --workspace "${WORKSPACE}" --dry-run -o yaml 2>&1 \
              || nkp create catalog-collection --url "${url}" --tag 2.19 --workspace "${WORKSPACE}" --dry-run 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
