---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  url: https://charts.kasten.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}
  namespace: ${releaseNamespace}
spec:
  interval: 1m
  releaseName: k10
  targetNamespace: kasten-io
  storageNamespace: kasten-io
  chart:
    spec:
      chart: k10
      version: 9.0.11
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-${appVersion}-chart
        namespace: ${releaseNamespace}
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 30
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    # Workspace-Konfiguration aus der NKP-UI (falls vorhanden)
    - kind: ConfigMap
      name: ${releaseName}-config-overrides
      valuesKey: values.yaml
      optional: true
    # Cluster-Konfiguration aus der NKP-UI (falls vorhanden)
    - kind: ConfigMap
      name: ${releaseName}-cluster-overrides
      valuesKey: values.yaml
      optional: true
