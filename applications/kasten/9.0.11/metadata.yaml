overview: |-
  # Veeam Kasten for Kubernetes

  Kasten schützt komplette Kubernetes-Anwendungen inklusive Konfiguration
  und Persistent Volumes. Backups können auf S3-kompatiblen Object Storage,
  NFS oder nach Veeam Backup & Replication exportiert werden.

  - Policy-basierte Backups und Restores pro Namespace oder Applikation
  - Immutable Backups und Ransomware-Schutz
  - Disaster Recovery und Migration zwischen Clustern

  Kasten wird im Namespace `kasten-io` installiert.
  Dokumentation: https://docs.kasten.io
