apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Default-Values für Kasten. Clusterspezifische Werte (Ingress,
    # Auth, Storage) besser per configOverrides im AppDeployment setzen.
    auth:
      tokenAuth:
        enabled: true
    ingress:
      create: false
