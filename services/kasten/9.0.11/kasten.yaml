apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}
  namespace: ${releaseNamespace}
spec:
  interval: 1m
  releaseName: k10
  targetNamespace: kasten-io
  storageNamespace: kasten-io
  chart:
    spec:
      chart: k10
      version: 9.0.11
      sourceRef:
        kind: HelmRepository
        name: charts.kasten.io
        namespace: kommander-flux
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 30
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-config-defaults
